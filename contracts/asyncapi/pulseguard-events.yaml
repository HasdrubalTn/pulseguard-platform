asyncapi: 3.0.0
info:
  title: PulseGuard Integration Events
  version: 0.2.0
  description: Versioned events emitted by PulseGuard bounded contexts. All examples are synthetic.
servers:
  localRabbitMq:
    host: localhost:5672
    protocol: amqp
    description: Local RabbitMQ broker started by Docker Desktop.
channels:
  hl7MessageReceived:
    address: pulseguard.interoperability.hl7-message-received.v1
    messages:
      hl7MessageReceived:
        $ref: '#/components/messages/Hl7MessageReceived'
  patientRegistered:
    address: pulseguard.patient-registry.patient-registered.v1
    messages:
      patientRegistered:
        $ref: '#/components/messages/PatientRegistered'
operations:
  publishHl7MessageReceived:
    action: send
    channel:
      $ref: '#/channels/hl7MessageReceived'
  publishPatientRegistered:
    action: send
    channel:
      $ref: '#/channels/patientRegistered'
components:
  messages:
    Hl7MessageReceived:
      name: Hl7MessageReceived
      title: HL7 message envelope accepted
      payload:
        $ref: '#/components/schemas/Hl7MessageReceivedPayload'
    PatientRegistered:
      name: PatientRegistered
      title: Patient registration committed
      payload:
        $ref: '#/components/schemas/PatientRegisteredPayload'
  schemas:
    PatientRegisteredPayload:
      type: object
      additionalProperties: false
      required:
        - eventId
        - occurredOnUtc
        - schemaVersion
        - patientId
      properties:
        eventId:
          type: string
          format: uuid
        occurredOnUtc:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          const: 1
        patientId:
          type: string
          format: uuid
    Hl7MessageReceivedPayload:
      type: object
      additionalProperties: false
      required:
        - eventId
        - occurredOnUtc
        - schemaVersion
        - messageCode
        - controlId
      properties:
        eventId:
          type: string
          format: uuid
        occurredOnUtc:
          type: string
          format: date-time
        schemaVersion:
          type: integer
          const: 1
        messageCode:
          type: string
        triggerEvent:
          type: string
        controlId:
          type: string
        sendingApplication:
          type: string
        sendingFacility:
          type: string
